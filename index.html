<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f2557">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AR Cartas">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Alameda del Río</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ── CONFIGURACIÓN DE ESTILOS (Mantenida intacta) ── */
:root {
  --azul-noche:  #0f2557;
  --azul-real:   #1a3a8f;
  --azul-medio:  #2d5bbf;
  --azul-claro:  #4a7ad4;
  --azul-pale:   #d6e4ff;
  --azul-bg:     #f0f4ff;
  --dorado:      #f0a500;
  --dorado-pale: #fff3cc;
  --blanco:      #ffffff;
  --gris-1:      #f5f7fc;
  --gris-2:      #eaecf4;
  --gris-3:      #c4cade;
  --texto:       #0d1b3e;
  --texto-2:     #4a5578;
  --texto-3:     #8a95b8;
  --verde:       #1a7a4a;
  --verde-pale:  #d4f5e5;
  --naranja:     #e05d20;
  --naranja-pale:#fde8da;
  --rojo:        #c0392b;
  --radio:       12px;
  --radio-lg:    16px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body {
  font-family: 'Barlow', sans-serif;
  background: var(--gris-1);
  color: var(--texto);
  min-height: 100dvh;
  overscroll-behavior-y: none;
  -webkit-tap-highlight-color: transparent;
}

/* ── HEADER ─────────────────────────────────── */
.header {
  background: linear-gradient(135deg, var(--azul-noche) 0%, var(--azul-real) 100%);
  color: white;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 16px;
  padding-top: calc(12px + env(safe-area-inset-top));
  position: sticky; top: 0; z-index: 50;
  box-shadow: 0 2px 12px rgba(15,37,87,.4);
}
.logo-box {
  width: 38px; height: 38px; flex-shrink: 0;
  background: rgba(255,255,255,.12);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
}
.logo-sobre {
  width: 24px; height: 17px; background: white;
  border-radius: 2px; position: relative;
}
.logo-solapa {
  position: absolute; top: 0; left: 0; right: 0;
  height: 0; border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-top: 9px solid var(--azul-claro);
}
.logo-sello {
  position: absolute; bottom: 1px; right: 1px;
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--dorado);
  font-size: 5px; font-weight: 700; color: var(--azul-noche);
  display: flex; align-items: center; justify-content: center;
}
.header-title { flex: 1; }
.header-title strong {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 1.05rem; font-weight: 700; letter-spacing: .04em;
  display: block;
}
.header-title span { font-size: .7rem; opacity: .6; letter-spacing: .08em; text-transform: uppercase; }
.status-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  background: #4ade80;
  box-shadow: 0 0 0 2px rgba(74,222,128,.3);
}
.status-dot.off { background: #fb923c; box-shadow: 0 0 0 2px rgba(251,146,60,.3); }

/* ── TABS ────────────────────────────────────── */
.tabs {
  background: #0b1d47;
  display: flex;
  position: sticky; top: calc(62px + env(safe-area-inset-top)); z-index: 49;
}
.tab {
  flex: 1; border: none; background: none; cursor: pointer;
  color: rgba(255,255,255,.45);
  font-family: 'Barlow', sans-serif; font-weight: 600;
  font-size: .68rem; letter-spacing: .07em; text-transform: uppercase;
  padding: 10px 4px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  border-bottom: 3px solid transparent;
  transition: color .15s, border-color .15s;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.tab .ico { font-size: 1.15rem; line-height: 1; }
.tab.active { color: white; border-bottom-color: var(--dorado); }

/* ── CONTENIDO ───────────────────────────────── */
.page { display: none; padding: 16px 14px 90px; max-width: 600px; margin: 0 auto; }
.page.on { display: block; }

/* ── CARD ────────────────────────────────────── */
.card {
  background: white; border-radius: var(--radio-lg);
  padding: 18px 16px; margin-bottom: 14px;
  box-shadow: 0 1px 6px rgba(15,37,87,.08);
  border: 1px solid var(--gris-2);
}
.card-h { font-family: 'Barlow Condensed', sans-serif; font-size: 1.05rem; font-weight: 700; color: var(--azul-noche); letter-spacing: .02em; margin-bottom: 3px; }
.card-sub { font-size: .8rem; color: var(--texto-3); line-height: 1.45; margin-bottom: 16px; }

/* ── FORM ────────────────────────────────────── */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: .72rem; font-weight: 600; color: var(--texto-2); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 5px; }
.field input, .field select {
  width: 100%; padding: 12px 14px;
  border: 2px solid var(--gris-2); border-radius: 9px;
  font-family: 'Barlow', sans-serif; font-size: 1rem; color: var(--texto);
  background: white; transition: border-color .15s;
  -webkit-appearance: none; appearance: none;
}
.field input:focus, .field select:focus { outline: none; border-color: var(--azul-claro); }

/* ── BOTONES ─────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  padding: 13px 20px; border: none; border-radius: 10px;
  font-family: 'Barlow', sans-serif; font-size: .9rem; font-weight: 700;
  cursor: pointer; letter-spacing: .03em;
  transition: filter .15s, transform .1s;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--azul-medio); color: white; }
.btn-ghost   { background: var(--azul-bg); color: var(--azul-real); }
.btn-dorado  { background: var(--dorado); color: var(--azul-noche); }
.btn-verde   { background: var(--verde); color: white; }
.btn-danger  { background: #fee2e2; color: var(--rojo); }
.btn-full    { width: 100%; }
.btn-sm      { padding: 9px 14px; font-size: .8rem; border-radius: 8px; }

/* ── ITEMS APTO ──────────────────────────────── */
.apto-list { display: flex; flex-direction: column; gap: 9px; margin: 14px 0 0; }
.apto-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: var(--radio);
  background: var(--gris-1); border: 1.5px solid var(--azul-pale);
  animation: up .25s ease both;
}
/* Estilo para items que se pueden tocar/seleccionar */
.apto-item.interactive { cursor: pointer; transition: background 0.2s; }
.apto-item.interactive:active { background: var(--azul-pale); }

@keyframes up { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:none;} }
.apto-num {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  background: var(--azul-medio); color: white;
  font-family: 'Barlow Condensed', sans-serif; font-size: 1rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.apto-info { flex: 1; min-width: 0; }
.apto-info .conj { font-weight: 700; font-size: .92rem; }
.apto-info .dir  { font-size: .77rem; color: var(--texto-2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.apto-info .det  { font-size: .72rem; color: var(--texto-3); margin-top: 1px; }

/* ── SEARCH / FILTER ────────────────────────── */
.search-wrap { position: relative; margin-bottom: 12px; }
.search-wrap .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: .95rem; pointer-events: none; }
.search-input {
  width: 100%; padding: 11px 14px 11px 38px;
  border: 2px solid var(--gris-2); border-radius: 9px;
  font-family: 'Barlow', sans-serif; font-size: .93rem; color: var(--texto);
  background: white; transition: border-color .15s;
  -webkit-appearance: none; appearance: none;
}
.search-input:focus { outline: none; border-color: var(--azul-claro); }

.pend-item {
  padding: 13px 14px; border-radius: var(--radio);
  border: 1.5px solid var(--gris-2); background: white;
  margin-bottom: 10px;
}
.pend-main { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
.pend-info { flex: 1; min-width: 0; }
.pend-info .nombre { font-weight: 700; font-size: .92rem; }
.pend-info .dir    { font-size: .77rem; color: var(--texto-2); margin-top: 2px; }
.pend-info .fecha  { font-size: .72rem; color: var(--texto-3); margin-top: 3px; }
.pend-actions { display: flex; gap: 8px; }
.pend-actions .btn { flex: 1; }

/* ── STATS / PROGRESO ───────────────────────── */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.stat {
  background: white; border-radius: var(--radio-lg); padding: 16px 14px; text-align: center;
  border: 1px solid var(--gris-2); border-top: 4px solid var(--azul-medio);
}
.stat-n { font-family: 'Barlow Condensed', sans-serif; font-size: 1.9rem; font-weight: 700; color: var(--azul-noche); line-height: 1; }
.stat-l { font-size: .68rem; color: var(--texto-3); font-weight: 600; text-transform: uppercase; margin-top: 4px; }

.prog { margin-bottom: 14px; }
.prog-hd { display: flex; justify-content: space-between; font-size: .8rem; font-weight: 600; margin-bottom: 5px; }
.prog-bar { height: 9px; background: var(--gris-2); border-radius: 99px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--azul-medio), var(--azul-claro)); transition: width .8s ease; }

.conj-table { width: 100%; border-collapse: collapse; font-size: .83rem; }
.conj-table th { font-size: .67rem; text-transform: uppercase; color: var(--texto-3); padding: 7px 10px; background: var(--gris-1); text-align: left; }
.conj-table td { padding: 9px 10px; border-bottom: 1px solid var(--gris-2); }

/* ── OVERLAY Y MODAL ────────────────────────── */
.overlay {
  display: none; position: fixed; inset: 0; background: rgba(10,25,70,.58); z-index: 200;
  align-items: center; justify-content: center; flex-direction: column; gap: 14px;
}
.overlay.on { display: flex; }
.spin { width: 42px; height: 42px; border: 4px solid rgba(255,255,255,.2); border-top-color: var(--dorado); border-radius: 50%; animation: rot .65s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.spin-msg { color: white; font-size: .88rem; font-weight: 600; }

.modal-bg {
  display: none; position: fixed; inset: 0; background: rgba(10,25,70,.55); z-index: 300;
  align-items: flex-end; justify-content: center;
}
.modal-bg.on { display: flex; }
.modal-box {
  background: white; border-radius: 20px 20px 0 0; padding: 24px 20px calc(28px + env(safe-area-inset-bottom));
  width: 100%; max-width: 540px; animation: slideUp .22s ease;
  max-height: 90vh; overflow-y: auto;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
.modal-row { display: flex; gap: 10px; margin-top: 20px; }
.modal-row .btn { flex: 1; }

.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(70px);
  background: var(--azul-noche); color: white; padding: 11px 20px; border-radius: 99px;
  font-size: .86rem; font-weight: 600; opacity: 0; transition: all .28s; z-index: 400;
}
.toast.on { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.ok { background: var(--verde); }
.toast.err { background: var(--rojo); }

.badge { display: inline-flex; padding: 3px 9px; border-radius: 99px; font-size: .68rem; font-weight: 700; text-transform: uppercase; }
.b-naranja { background: var(--naranja-pale); color: var(--naranja); }
.b-gris { background: var(--gris-2); color: var(--texto-2); }
.b-verde { background: var(--verde-pale); color: var(--verde); }
</style>
</head>
<body>

<div class="overlay" id="ov">
  <div class="spin"></div>
  <div class="spin-msg" id="ov-msg">Procesando…</div>
</div>

<div class="modal-bg" id="modal">
  <div class="modal-box">
    <h3 id="m-titulo" style="margin-bottom:10px; font-family:'Barlow Condensed'"></h3>
    <div id="m-desc" style="font-size: 0.9rem; line-height: 1.5; color: var(--texto-2)"></div>
    <div class="modal-row">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="m-ok">Confirmar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<header class="header">
  <div class="logo-box"><div class="logo-sobre"><div class="logo-solapa"></div><div class="logo-sello">AR</div></div></div>
  <div class="header-title"><strong>Alameda del Río</strong><span>Gestión de Cartas</span></div>
  <div class="status-dot" id="sdot"></div>
</header>

<nav class="tabs">
  <button class="tab active" onclick="goTab('elaborar',this)"><span class="ico">✉️</span>Elaborar</button>
  <button class="tab" onclick="goTab('entregar',this)"><span class="ico">📬</span>Entregar</button>
  <button class="tab" onclick="goTab('stats',this)"><span class="ico">📊</span>Estadísticas</button>
</nav>

<div class="page on" id="pg-elaborar">
  <div class="card">
    <div class="card-h">Generar cartas</div>
    <div class="card-sub">Selecciona los apartamentos para trabajar hoy.</div>
    
    <div class="field">
      <label>Cantidad (solo para selección aleatoria)</label>
      <input type="number" id="n-cartas" min="1" max="12" value="6">
    </div>

    <div style="display: flex; gap: 10px;">
      <button class="btn btn-primary btn-full" onclick="generarAleatorio()">🎲 Aleatorio</button>
      <button class="btn btn-ghost btn-full" onclick="abrirManual()">🔍 Manual</button>
    </div>
  </div>

  <div id="bloque-sel" style="display:none">
    <div class="card" style="border: 2px solid var(--dorado)">
      <div class="card-h">Selección actual</div>
      <div class="card-sub">Confirma para marcarlos como <strong>Elaborada</strong>.</div>
      <div class="apto-list" id="lista-sel"></div>
      <div class="btn-row" style="margin-top: 15px; display:flex; gap:10px;">
        <button class="btn btn-dorado btn-full" onclick="confirmar()">✅ Confirmar</button>
        <button class="btn btn-ghost" onclick="cancelarSeleccion()">✕</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-h">Elaboradas pendientes</div>
    <div id="lista-elab"></div>
  </div>
</div>

<div class="page" id="pg-entregar">
  <div class="card">
    <div class="card-h">Pendientes de entrega</div>
    <div class="search-wrap">
      <span class="ico">🔍</span>
      <input type="search" class="search-input" id="filtro" placeholder="Buscar..." oninput="renderPend()">
    </div>
    <div id="lista-pend"></div>
  </div>
</div>

<div class="page" id="pg-stats">
  <div class="stats-grid" id="s-grid"></div>
  <div class="card">
    <div class="card-h">Progreso Global</div>
    <div id="s-progreso"></div>
  </div>
</div>

<script>
// ─── CONFIGURACIÓN (Mantén tu URL de Apps Script aquí) ───
const API = 'https://script.google.com/macros/s/AKfycbwgbZ93OiI27C0pFrf-jEDAUFRU9QMcABOuWJCpKwoXbDyVv58e_LsC4SqKt6JnIspJ/exec';

// ─── ESTADO GLOBAL ───
let elaboradas = [];
let disponibles = [];
let selActual = [];
let modalCb = null;

// ─── UTILIDADES ───
const showOv = msg => { document.getElementById('ov-msg').textContent = msg; document.getElementById('ov').classList.add('on'); };
const hideOv = () => document.getElementById('ov').classList.remove('on');
const toast = (msg, cls='') => {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast on ' + cls;
  setTimeout(() => t.classList.remove('on'), 3000);
};

const fmt = a => `Apto ${a.apto}${a.torre ? ' · T'+a.torre : ''}${a.interior ? ' · I'+a.interior : ''}`;

async function apiGet(params) {
  try {
    const qs = new URLSearchParams(params).toString();
    const response = await fetch(`${API}?${qs}`, { method: 'GET', mode: 'cors', redirect: 'follow' });
    if (!response.ok) throw new Error('Error de red');
    return await response.json();
  } catch (e) {
    console.error("Error en API:", e);
    throw e;
  }
}

// ─── LÓGICA DE SELECCIÓN ───

// 1. Aleatoria
async function generarAleatorio() {
  const n = parseInt(document.getElementById('n-cartas').value) || 6;
  showOv('Buscando disponibles...');
  try {
    const res = await apiGet({ action: 'disponibles' });
    disponibles = res.data || [];
    
    if (!disponibles.length) { toast('No hay disponibles', 'err'); hideOv(); return; }

    // Agrupar por conjunto para diversificar
    const map = {};
    disponibles.forEach(a => {
      if (!map[a.conjunto]) map[a.conjunto] = [];
      map[a.conjunto].push(a);
    });

    const picks = [];
    const keys = Object.keys(map).sort(() => Math.random() - 0.5);
    
    for (let i = 0; i < n; i++) {
        const conj = keys[i % keys.length];
        const listaConj = map[conj];
        if (listaConj.length) {
            const index = Math.floor(Math.random() * listaConj.length);
            picks.push(listaConj.splice(index, 1)[0]);
        }
    }

    selActual = picks;
    renderSelActual();
  } catch(e) {
    toast('Error de conexión', 'err');
  }
  hideOv();
}

// 2. Manual
async function abrirManual() {
  showOv('Cargando lista...');
  try {
    const res = await apiGet({ action: 'disponibles' });
    disponibles = res.data || [];
    
    let html = `
      <div class="search-wrap" style="margin-top:10px">
        <span class="ico">🔍</span>
        <input type="text" class="search-input" id="m-buscar" placeholder="Filtrar por conjunto o apto..." oninput="filtrarManual()">
      </div>
      <div id="m-lista" style="max-height:300px; overflow-y:auto; margin-top:10px; border-radius:8px;">
        ${renderListaManual(disponibles)}
      </div>
    `;

    openModal('Selección Manual', html, 'Agregar Seleccionados', () => {
      if (selActual.length) {
        renderSelActual();
        closeModal();
      } else {
        toast('Selecciona al menos uno', 'err');
      }
    });
  } catch(e) {
    toast('Error al cargar', 'err');
  }
  hideOv();
}

function renderListaManual(lista) {
  if (!lista.length) return '<p style="text-align:center; padding:20px;">No hay disponibles</p>';
  return lista.map(a => `
    <div class="apto-item interactive" onclick="toggleSeleccionManual(this, ${a.id})" id="m-item-${a.id}" 
         style="margin-bottom:5px; border-color: ${selActual.find(s=>s.id==a.id)?'var(--dorado)':'var(--gris-2)'}">
      <div class="apto-info">
        <div class="conj">${a.conjunto}</div>
        <div class="det">${fmt(a)}</div>
      </div>
      <div>${selActual.find(s=>s.id==a.id)?'✅':'➕'}</div>
    </div>
  `).join('');
}

function filtrarManual() {
  const q = document.getElementById('m-buscar').value.toLowerCase();
  const filtered = disponibles.filter(a => a.conjunto.toLowerCase().includes(q) || String(a.apto).includes(q));
  document.getElementById('m-lista').innerHTML = renderListaManual(filtered);
}

function toggleSeleccionManual(el, id) {
  const item = disponibles.find(a => a.id === id);
  const idx = selActual.findIndex(s => s.id === id);

  if (idx > -1) {
    selActual.splice(idx, 1);
    el.style.borderColor = 'var(--gris-2)';
    el.querySelector('div:last-child').textContent = '➕';
  } else {
    selActual.push(item);
    el.style.borderColor = 'var(--dorado)';
    el.querySelector('div:last-child').textContent = '✅';
  }
}

// ─── RENDERIZADO Y ACCIONES ───

function renderSelActual() {
  const div = document.getElementById('bloque-sel');
  const lista = document.getElementById('lista-sel');
  
  if (!selActual.length) { div.style.display = 'none'; return; }
  
  div.style.display = 'block';
  lista.innerHTML = selActual.map(a => `
    <div class="apto-item" style="background: white">
      <div class="apto-info">
        <div class="conj">${a.conjunto}</div>
        <div class="det">${fmt(a)}</div>
      </div>
    </div>
  `).join('');
  div.scrollIntoView({ behavior: 'smooth' });
}

function cancelarSeleccion() {
    selActual = [];
    renderSelActual();
}

async function confirmar() {
  showOv('Guardando...');
  try {
    const ids = selActual.map(a => a.id).join(',');
    const res = await apiGet({ action: 'marcar_elaborada', ids, fecha: new Date().toISOString() });
    if (res.ok) {
      toast('Cartas guardadas', 'ok');
      selActual = [];
      renderSelActual();
      cargarElab();
    }
  } catch(e) { toast('Error al guardar', 'err'); }
  hideOv();
}

async function cargarElab() {
  try {
    const res = await apiGet({ action: 'elaboradas' });
    elaboradas = res.data || [];
    document.getElementById('lista-elab').innerHTML = elaboradas.map(a => `
      <div class="apto-item" style="background:white; border-color:var(--gris-2); margin-top:8px">
        <div class="apto-info">
          <div class="conj">${a.conjunto} · ${fmt(a)}</div>
          <div class="det">Pendiente de entrega</div>
        </div>
        <span class="badge b-naranja">Elaborada</span>
      </div>
    `).join('') || '<p class="empty">No hay cartas elaboradas hoy.</p>';
  } catch(e) {}
}

function renderPend() {
  const q = document.getElementById('filtro').value.toLowerCase();
  const filtered = elaboradas.filter(a => a.conjunto.toLowerCase().includes(q) || String(a.apto).includes(q));
  document.getElementById('lista-pend').innerHTML = filtered.map(a => `
    <div class="pend-item">
      <div class="pend-main">
        <div class="pend-info">
          <div class="nombre">${a.conjunto} - ${fmt(a)}</div>
        </div>
      </div>
      <div class="pend-actions">
        <button class="btn btn-verde btn-sm" onclick="entregar(${a.id})">📬 Entregada</button>
        <button class="btn btn-danger btn-sm" onclick="deshacer(${a.id})">↩️</button>
      </div>
    </div>
  `).join('');
}

async function entregar(id) {
    showOv('Registrando...');
    try {
        await apiGet({ action: 'marcar_entregada', ids: id, fecha: new Date().toISOString() });
        cargarPend();
    } catch(e) { toast('Error', 'err'); }
    hideOv();
}

async function deshacer(id) {
    showOv('Revirtiendo...');
    try {
        await apiGet({ action: 'deshacer', ids: id });
        cargarPend();
    } catch(e) { toast('Error', 'err'); }
    hideOv();
}

async function cargarPend() {
    const res = await apiGet({ action: 'elaboradas' });
    elaboradas = res.data || [];
    renderPend();
}

async function cargarStats() {
    showOv('Cargando...');
    try {
        const res = await apiGet({ action: 'estadisticas' });
        const r = res.resumen;
        document.getElementById('s-grid').innerHTML = `
            <div class="stat"><div class="stat-n">${r.total}</div><div class="stat-l">Total</div></div>
            <div class="stat" style="border-top-color:var(--verde)"><div class="stat-n">${r.entregadas}</div><div class="stat-l">Entregadas</div></div>
        `;
        document.getElementById('s-progreso').innerHTML = `
            <div class="prog">
                <div class="prog-hd"><span>Progreso</span><span>${r.pct_entregadas}%</span></div>
                <div class="prog-bar"><div class="prog-fill" style="width:${r.pct_entregadas}%"></div></div>
            </div>
        `;
    } catch(e){}
    hideOv();
}

function goTab(tab, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.getElementById('pg-' + tab).classList.add('on');
  btn.classList.add('active');
  if (tab === 'elaborar') cargarElab();
  if (tab === 'entregar') cargarPend();
  if (tab === 'stats') cargarStats();
}

function openModal(t, d, l, cb) {
  document.getElementById('m-titulo').textContent = t;
  document.getElementById('m-desc').innerHTML = d;
  document.getElementById('m-ok').textContent = l;
  modalCb = cb;
  document.getElementById('modal').classList.add('on');
}
function closeModal() { document.getElementById('modal').classList.remove('on'); }
document.getElementById('m-ok').onclick = () => modalCb();

// Inicialización
cargarElab();
</script>
</body>
</html>
