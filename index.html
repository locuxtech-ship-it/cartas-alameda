<script>
// ─── CONFIG ────────────────────────────────────────────
const API = 'https://script.google.com/macros/s/AKfycbwgbZ93OiI27C0pFrf-jEDAUFRU9QMcABOuWJCpKwoXbDyVv58e_LsC4SqKt6JnIspJ/exec';

// ─── ESTADO ─────────────────────────────────────────────
let elaboradas  = [];
let selActual   = [];
let modalCb     = null;

// ─── UTILIDADES ─────────────────────────────────────────
const fmt = a => {
  let s = `Apto ${a.apto}`;
  if (a.torre)    s += ` · Torre ${a.torre}`;
  if (a.interior) s += ` · Int ${a.interior}`;
  return s;
};

const fmtF = iso => {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('es-CO', {day:'2-digit',month:'short',year:'numeric'})
    + ' ' + d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
};

const desde = iso => {
  if (!iso) return '';
  const d = Math.floor((Date.now() - new Date(iso)) / 86400000);
  return d === 0 ? 'hoy' : d === 1 ? 'ayer' : `hace ${d} días`;
};

// ─── LOADING ─────────────────────────────────────────────
const showOv  = msg => { document.getElementById('ov-msg').textContent = msg; document.getElementById('ov').classList.add('on'); };
const hideOv  = ()  => document.getElementById('ov').classList.remove('on');

// ─── TOAST ───────────────────────────────────────────────
let _tid;
const toast = (msg, cls='') => {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast on ' + cls;
  clearTimeout(_tid); _tid = setTimeout(() => t.classList.remove('on'), 3000);
};

// ─── MODAL ───────────────────────────────────────────────
const openModal = (titulo, desc, label, cb) => {
  document.getElementById('m-titulo').textContent = titulo;
  document.getElementById('m-desc').innerHTML = desc;
  document.getElementById('m-ok').textContent = label;
  modalCb = cb;
  document.getElementById('modal').classList.add('on');
};
const closeModal = () => {
  document.getElementById('modal').classList.remove('on');
  modalCb = null;
};
document.getElementById('m-ok').onclick = () => { if (modalCb) modalCb(); };
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeModal();
});

// ─── ONLINE STATUS ───────────────────────────────────────
const setOnline = ok => {
  document.getElementById('sdot').className = 'status-dot' + (ok ? '' : ' off');
};
window.addEventListener('online',  () => setOnline(true));
window.addEventListener('offline', () => setOnline(false));
setOnline(navigator.onLine);

// ─── BANNER ──────────────────────────────────────────────
const showBanner = msg => {
  document.getElementById('banner-txt').textContent = msg;
  document.getElementById('banner').classList.add('show');
};
const hideBanner = () => document.getElementById('banner').classList.remove('show');

// ─── PETICIONES API ──────────────────────────────────────

// GET para lectura (disponibles, elaboradas, estadísticas)
const apiGet = async params => {
  const qs  = new URLSearchParams(params).toString();
  const res = await fetch(`${API}?${qs}`, { redirect: 'follow' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
};

// POST para escritura (marcar_elaborada, marcar_entregada, deshacer)
const apiPost = async data => {
  const res = await fetch(API, {
    method: 'POST',
    mode: 'no-cors', // Necesario para Google Apps Script POST desde navegador
    body: JSON.stringify(data)
  });
  // Como usamos no-cors para evitar problemas de redirección, 
  // asumimos que si no hay error de red, se envió correctamente.
  return { ok: true }; 
};

// ─── TABS ─────────────────────────────────────────────────
const goTab = (tab, btn) => {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  document.getElementById('pg-' + tab).classList.add('on');
  btn.classList.add('active');
  if (tab === 'elaborar')    cargarElab();
  if (tab === 'entregar')    cargarPend();
  if (tab === 'stats')       cargarStats();
};

// ═══════════════════════════════════════════════
// MÓDULO 1 – ELABORAR
// ═══════════════════════════════════════════════
async function generar() {
  const n = Math.min(12, Math.max(1, parseInt(document.getElementById('n-cartas').value) || 6));
  showOv('Consultando disponibles…');
  try {
    const res = await apiGet({ action: 'disponibles' });
    setOnline(true); hideBanner();

    const map = {};
    (res.data || []).forEach(a => {
      if (!map[a.conjunto]) map[a.conjunto] = [];
      map[a.conjunto].push(a);
    });
    const conjs = Object.keys(map);
    if (!conjs.length) { toast('No hay apartamentos disponibles', 'err'); hideOv(); return; }

    const max   = Math.min(n, conjs.length);
    const picks = conjs.sort(() => Math.random() - .5).slice(0, max);
    selActual   = picks.map(c => { const l = map[c]; return l[Math.floor(Math.random() * l.length)]; });

    renderSel();
    const bl = document.getElementById('bloque-sel');
    bl.style.display = 'block';
    setTimeout(() => bl.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
  } catch(e) {
    setOnline(false);
    showBanner('No se pudo conectar. Verifica tu conexión a internet.');
    toast('Error de conexión', 'err');
  }
  hideOv();
}

const renderSel = () => {
  document.getElementById('lista-sel').innerHTML = selActual.map((a, i) => `
    <div class="apto-item">
      <div class="apto-num">${i+1}</div>
      <div class="apto-info">
        <div class="conj">${a.conjunto}</div>
        <div class="dir">📍 ${a.direccion}</div>
        <div class="det">${fmt(a)}</div>
      </div>
      <span class="badge b-gris">Por elaborar</span>
    </div>`).join('');
};

function confirmar() {
  if (!selActual.length) return;
  const ul = selActual.map(a => `<li style="margin:4px 0">${a.conjunto} – ${fmt(a)}</li>`).join('');
  openModal(
    'Confirmar elaboración',
    `¿Confirmas que vas a elaborar estas ${selActual.length} carta(s)?<ul style="margin:10px 0 0 18px;font-size:.83rem;color:#555">${ul}</ul>`,
    '✅ Confirmar',
    async () => {
      closeModal();
      showOv('Guardando en Google Sheets…');
      try {
        // CORRECCIÓN: Enviar como POST y enviar IDs como ARRAY
        const res = await apiPost({ 
          action: 'marcar_elaborada', 
          ids: selActual.map(a => a.id), 
          fecha: new Date().toISOString() 
        });
        
        toast(`✅ Cartas marcadas como elaboradas`, 'ok');
        selActual = [];
        document.getElementById('bloque-sel').style.display = 'none';
        cargarElab();
      } catch(e) {
        toast('Error de conexión', 'err');
      }
      hideOv();
    }
  );
}

async function cargarElab() {
  const c = document.getElementById('lista-elab');
  c.innerHTML = '<div class="empty"><div class="ei">⏳</div><div class="et">Cargando…</div></div>';
  try {
    const res = await apiGet({ action: 'elaboradas' });
    elaboradas = res.data || [];
    renderElab();
  } catch(e) {
    c.innerHTML = '<div class="empty"><div class="ei">⚠️</div><div class="et">Error al cargar. Verifica conexión.</div></div>';
  }
}

const renderElab = () => {
  const c = document.getElementById('lista-elab');
  if (!elaboradas.length) {
    c.innerHTML = '<div class="empty"><div class="ei">📭</div><div class="et">No hay cartas elaboradas pendientes.</div></div>';
    return;
  }
  c.innerHTML = elaboradas.map(a => `
    <div class="apto-item" style="background:white;border-color:var(--naranja-pale)">
      <div class="apto-info">
        <div class="conj">${a.conjunto} – ${fmt(a)}</div>
        <div class="dir">📍 ${a.direccion}</div>
        <div class="det">✏️ ${desde(a.fecha_elaborada)} · ${fmtF(a.fecha_elaborada)}</div>
      </div>
      <span class="badge b-naranja">Elaborada</span>
    </div>`).join('');
};

// ═══════════════════════════════════════════════
// MÓDULO 2 – ENTREGAR
// ═══════════════════════════════════════════════
async function cargarPend() {
  const c = document.getElementById('lista-pend');
  c.innerHTML = '<div class="empty"><div class="ei">⏳</div><div class="et">Cargando…</div></div>';
  try {
    const res = await apiGet({ action: 'elaboradas' });
    elaboradas = res.data || [];
    renderPend();
  } catch(e) {
    c.innerHTML = '<div class="empty"><div class="ei">⚠️</div><div class="et">Error al cargar.</div></div>';
  }
}

function renderPend() {
  const q = (document.getElementById('filtro')?.value || '').toLowerCase();
  const c = document.getElementById('lista-pend');
  const lista = q
    ? elaboradas.filter(a =>
        a.conjunto.toLowerCase().includes(q) ||
        String(a.apto).toLowerCase().includes(q) ||
        a.direccion.toLowerCase().includes(q))
    : elaboradas;

  if (!elaboradas.length) {
    c.innerHTML = '<div class="empty"><div class="ei">🎉</div><div class="et">¡No hay cartas pendientes!</div></div>';
    return;
  }
  if (!lista.length) {
    c.innerHTML = '<div class="empty"><div class="ei">🔍</div><div class="et">Sin resultados para ese filtro.</div></div>';
    return;
  }
  c.innerHTML = lista.map(a => `
    <div class="pend-item">
      <div class="pend-main">
        <div class="pend-info">
          <div class="nombre">${a.conjunto} – ${fmt(a)}</div>
          <div class="dir">📍 ${a.direccion}</div>
          <div class="fecha">✏️ Elaborada ${desde(a.fecha_elaborada)} · ${fmtF(a.fecha_elaborada)}</div>
        </div>
        <span class="badge b-naranja">Elaborada</span>
      </div>
      <div class="pend-actions">
        <button class="btn btn-verde btn-sm"
          onclick="entregar(${a.id},'${a.conjunto.replace(/'/g,"\\'")}','${fmt(a).replace(/'/g,"\\'")}')">
          📬 Entregada
        </button>
        <button class="btn btn-danger btn-sm"
          onclick="deshacerElab(${a.id},'${a.conjunto.replace(/'/g,"\\'")}')">
          ↩️ Deshacer
        </button>
      </div>
    </div>`).join('');
}

function entregar(id, conjunto, desc) {
  openModal(
    'Confirmar entrega',
    `¿Confirmas que la carta de <strong>${conjunto}</strong> – ${desc} fue entregada en el apartamento?`,
    '📬 Confirmar entrega',
    async () => {
      closeModal();
      showOv('Registrando entrega…');
      try {
        // CORRECCIÓN: POST con ID en array
        await apiPost({ 
          action: 'marcar_entregada', 
          ids: [id], 
          fecha: new Date().toISOString() 
        });
        elaboradas = elaboradas.filter(a => a.id !== id);
        renderPend();
        toast('📬 Carta marcada como entregada', 'ok');
      } catch(e) { toast('Error de conexión', 'err'); }
      hideOv();
    }
  );
}

function deshacerElab(id, conjunto) {
  openModal(
    'Deshacer elaboración',
    `¿Devolver el apartamento de <strong>${conjunto}</strong> al estado disponible? Se borrarán las fechas.`,
    '↩️ Deshacer',
    async () => {
      closeModal();
      showOv('Deshaciendo…');
      try {
        // CORRECCIÓN: POST con ID en array
        await apiPost({ 
          action: 'deshacer', 
          ids: [id] 
        });
        elaboradas = elaboradas.filter(a => a.id !== id);
        renderPend();
        toast('↩️ Carta devuelta a disponible');
      } catch(e) { toast('Error de conexión', 'err'); }
      hideOv();
    }
  );
}

// ═══════════════════════════════════════════════
// MÓDULO 3 – ESTADÍSTICAS
// ═══════════════════════════════════════════════
async function cargarStats() {
  showOv('Cargando estadísticas…');
  try {
    const res = await apiGet({ action: 'estadisticas' });
    renderStats(res);
  } catch(e) { toast('Error al cargar estadísticas', 'err'); }
  hideOv();
}

function renderStats(d) {
  const r    = d.resumen;
  const conj = d.por_conjunto;
  const acts = d.ultimas_actividades || [];

  document.getElementById('s-grid').innerHTML = `
    <div class="stat">
      <div class="stat-n">${r.total.toLocaleString()}</div>
      <div class="stat-l">Aptos en territorio</div>
    </div>
    <div class="stat s-naranja">
      <div class="stat-n">${(parseFloat(r.elaboradas) + parseFloat(r.entregadas)).toLocaleString()}</div>
      <div class="stat-l">Cartas hechas</div>
    </div>
    <div class="stat s-verde">
      <div class="stat-n">${r.entregadas.toLocaleString()}</div>
      <div class="stat-l">Entregadas</div>
    </div>
    <div class="stat s-dorado">
      <div class="stat-n">${r.pct_entregadas}%</div>
      <div class="stat-l">% Cubierto</div>
    </div>`;

  document.getElementById('s-progreso').innerHTML = `
    <div class="prog">
      <div class="prog-hd"><span>Cartas entregadas</span><span style="color:var(--verde)">${r.pct_entregadas}%</span></div>
      <div class="prog-bar"><div class="prog-fill" style="width:${r.pct_entregadas}%"></div></div>
      <div class="prog-sub">${r.entregadas} de ${r.total} apartamentos</div>
    </div>
    <div class="prog">
      <div class="prog-hd"><span>Total elaboradas</span><span style="color:var(--naranja)">${r.pct_hechas}%</span></div>
      <div class="prog-bar"><div class="prog-fill orange" style="width:${r.pct_hechas}%"></div></div>
      <div class="prog-sub">${parseFloat(r.elaboradas) + parseFloat(r.entregadas)} de ${r.total} apartamentos</div>
    </div>`;

  const rows = Object.entries(conj).sort((a,b) => b[1].total - a[1].total);
  document.getElementById('s-tabla').innerHTML = `
    <thead><tr><th>Conjunto</th><th>Total</th><th>Elab.</th><th>Entr.</th><th>Avance</th></tr></thead>
    <tbody>${rows.map(([n, v]) => {
      const p = ((v.entregadas / v.total) * 100).toFixed(0);
      return `<tr>
        <td><strong>${n}</strong></td><td>${v.total}</td>
        <td style="color:var(--naranja);font-weight:700">${v.elaboradas}</td>
        <td style="color:var(--verde);font-weight:700">${v.entregadas}</td>
        <td><div class="mini-bar"><div class="b"><div class="f" style="width:${p}%"></div></div><div class="p">${p}%</div></div></td>
      </tr>`;
    }).join('')}</tbody>`;

  const aDiv = document.getElementById('s-acts');
  if (!acts.length) {
    aDiv.innerHTML = '<div class="empty"><div class="ei">📋</div><div class="et">Sin actividad aún.</div></div>';
    return;
  }
  aDiv.innerHTML = acts.map(a => `
    <div class="act-item ${a.tipo}">
      <div class="act-ico">${a.tipo === 'elaborada' ? '✏️' : '📬'}</div>
      <div class="act-txt">
        <div class="n">${a.apto.conjunto} – ${fmt(a.apto)}</div>
        <div class="f">${a.tipo === 'elaborada' ? 'Elaborada' : 'Entregada'} · ${fmtF(a.fecha)} (${desde(a.fecha)})</div>
      </div>
      <span class="badge ${a.tipo === 'elaborada' ? 'b-naranja' : 'b-verde'}">${a.tipo === 'elaborada' ? 'Elab.' : 'Entr.'}</span>
    </div>`).join('');
}

// ─── SERVICE WORKER ───────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// ─── INIT ─────────────────────────────────────────────────
cargarElab();
</script>
